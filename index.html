<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weather App</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1923;
      --card: #18273a;
      --accent: #4fb3ff;
      --text: #e8f0fe;
      --muted: #6b8aad;
      --border: rgba(79,179,255,0.15);
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background-image:
        radial-gradient(ellipse at 20% 20%, rgba(79,179,255,0.07) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 80%, rgba(79,100,255,0.07) 0%, transparent 60%);
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      letter-spacing: -0.5px;
      margin-bottom: 1.5rem;
      color: var(--text);
    }

    h1 span { color: var(--accent); }

    .search-row {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 480px;
      margin-bottom: 1.5rem;
    }

    input {
      flex: 1;
      padding: 0.75rem 1.1rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      outline: none;
      transition: border 0.2s;
    }

    input::placeholder { color: var(--muted); }
    input:focus { border-color: var(--accent); }

    button {
      padding: 0.75rem 1.4rem;
      border-radius: 10px;
      border: none;
      background: var(--accent);
      color: #0f1923;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover { opacity: 0.85; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 2rem 2.5rem;
      width: 100%;
      max-width: 480px;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      animation: fadeUp 0.35s ease;
    }

    .card.show { display: flex; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .city-name {
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--text);
    }

    .country { color: var(--muted); font-size: 14px; margin-bottom: 0.5rem; }

    .weather-icon { font-size: 5rem; line-height: 1; margin: 0.5rem 0; }

    .temp {
      font-family: 'Playfair Display', serif;
      font-size: 4rem;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
    }

    .description {
      font-size: 15px;
      color: var(--muted);
      text-transform: capitalize;
      margin-bottom: 0.8rem;
    }

    .details {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      width: 100%;
      margin-top: 1rem;
    }

    .detail-box {
      background: rgba(79,179,255,0.06);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.7rem 0.5rem;
      text-align: center;
    }

    .detail-label { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
    .detail-value { font-size: 15px; font-weight: 500; color: var(--text); }

    .error {
      color: #ff6b6b;
      font-size: 14px;
      margin-top: -0.5rem;
      display: none;
    }

    .error.show { display: block; }

    .api-note {
      margin-top: 1.5rem;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      max-width: 480px;
      line-height: 1.6;
    }

    .api-note a { color: var(--accent); text-decoration: none; }
    .api-note a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <h1>🌧️Mausam🌧️</h1>

  <div class="search-row">
    <input type="text" id="cityInput" placeholder="Enter city name..." />
    <button onclick="getWeather()">Search</button>
  </div>

  <p class="error" id="error">City not found. Please try again.</p>

  <div class="card" id="card">
    <div class="city-name" id="cityName"></div>
    <div class="country" id="country"></div>
    <div class="weather-icon" id="weatherIcon"></div>
    <div class="temp" id="temp"></div>
    <div class="description" id="description"></div>
    <div class="details">
      <div class="detail-box">
        <div class="detail-label">Feels Like</div>
        <div class="detail-value" id="feelsLike"></div>
      </div>
      <div class="detail-box">
        <div class="detail-label">Humidity</div>
        <div class="detail-value" id="humidity"></div>
      </div>
      <div class="detail-box">
        <div class="detail-label">Wind</div>
        <div class="detail-value" id="wind"></div>
      </div>
    </div>
  </div>


  <script>
    // ← Paste your free API key from openweathermap.org here
    const API_KEY = "e85e09aa13ae0e3678b99a8d5ecb51b1";

    const ICONS = {
      "01": "☀️", "02": "🌤️", "03": "☁️", "04": "☁️",
      "09": "🌧️", "10": "🌦️", "11": "⛈️", "13": "❄️", "50": "🌫️"
    };

    function getIcon(iconCode) {
      const prefix = iconCode.slice(0, 2);
      return ICONS[prefix] || "🌡️";
    }

    async function getWeather() {
      const city = document.getElementById("cityInput").value.trim();
      const card = document.getElementById("card");
      const error = document.getElementById("error");

      if (!city) return;

      card.classList.remove("show");
      error.classList.remove("show");

      try {
        const url = `https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(city)}&appid=${API_KEY}&units=metric`;
        const res = await fetch(url);

        if (!res.ok) throw new Error("City not found");

        const data = await res.json();

        document.getElementById("cityName").textContent = data.name;
        document.getElementById("country").textContent = data.sys.country;
        document.getElementById("weatherIcon").textContent = getIcon(data.weather[0].icon);
        document.getElementById("temp").textContent = Math.round(data.main.temp) + "°C";
        document.getElementById("description").textContent = data.weather[0].description;
        document.getElementById("feelsLike").textContent = Math.round(data.main.feels_like) + "°C";
        document.getElementById("humidity").textContent = data.main.humidity + "%";
        document.getElementById("wind").textContent = Math.round(data.wind.speed) + " m/s";

        card.classList.add("show");

      } catch (err) {
        error.classList.add("show");
      }
    }

    // Search on Enter key
    document.getElementById("cityInput").addEventListener("keydown", e => {
      if (e.key === "Enter") getWeather();
    });
  </script>

</body>
</html>
